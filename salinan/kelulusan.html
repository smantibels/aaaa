<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman Kelulusan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    background:#3a7a45;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* FRAME LAPTOP */
.laptop{
    width:900px;
    max-width:100%;
}

.screen{
    background:#2d0452;
    border:16px solid #1b1b1b;
    border-bottom:0;
    border-radius:20px 20px 0 0;
    min-height:520px;
    position:relative;
    overflow:hidden;
    padding:35px;
}

/* kamera laptop */
.camera{
    width:10px;
    height:10px;
    background:#ddd;
    border-radius:50%;
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
}

/* body laptop */
.base{
    height:30px;
    background:#111;
    border-radius:0 0 20px 20px;
    position:relative;
}

.base::before{
    content:'';
    width:140px;
    height:8px;
    background:#f2f2f2;
    border-radius:0 0 10px 10px;
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
}

.base::after{
    content:'';
    width:60px;
    height:10px;
    background:#ddd;
    border-radius:8px;
    position:absolute;
    left:20px;
    top:10px;
}

/* tombol kanan */
.dots{
    position:absolute;
    right:20px;
    top:10px;
    display:flex;
    gap:8px;
}

.dots span{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ddd;
}

/* isi layar */
.topbar{
    position:absolute;
    top:12px;
    right:20px;
    color:#fff;
    font-size:12px;
}

.content{
    text-align:center;
    color:white;
    margin-top:70px;
    position:relative;
    z-index:2;
}

.logo{
    width:85px;

    border-radius:80%;
    margin:auto;
    overflow:hidden;

}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    
}

h1{
    margin-top:28px;
    font-size:42px;
    font-weight:700;
    letter-spacing:1px;
}

.school{
    margin-top:12px;
    font-size:20px;
    font-weight:600;
}

.year{
    font-size:18px;
    margin-top:4px;
}

.info{
    color:#39ff70;
    margin-top:22px;
    font-size:15px;
    font-weight:500;
}

.form-box{
    margin-top:25px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:0;
}

.form-box input{
    width:360px;
    max-width:100%;
    padding:16px;
    border:none;
    outline:none;
    font-size:15px;
    background:#fff;
}

.form-box button{
    padding:16px 28px;
    border:none;
    background:#7a1fa2;
    color:#fff;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.form-box button:hover{
    background:#9c27b0;
}

/* gunung background */
.mountain1,
.mountain2,
.sun{
    position:absolute;
}

.mountain1{
    bottom:0;
    left:0;
    width:320px;
    height:140px;
    background:#5b187e;
    clip-path:polygon(0 100%,0 70%,18% 45%,30% 60%,42% 30%,58% 65%,72% 45%,100% 100%);
}

.mountain2{
    bottom:0;
    right:0;
    width:420px;
    height:170px;
    background:#421060;
    clip-path:polygon(0 100%,0 60%,20% 30%,40% 55%,55% 20%,75% 50%,100% 100%);
}

.sun{
    width:160px;
    height:160px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    bottom:-45px;
    left:50%;
    transform:translateX(-50%);
}

/* responsive */
@media(max-width:768px){
    h1{font-size:28px;}
    .school{font-size:16px;}
    .year{font-size:14px;}
    .form-box{
        flex-direction:column;
        align-items:center;
        gap:10px;
    }
    .form-box input,
    .form-box button{
        width:100%;
        max-width:360px;
    }
}
@keyframes muncul{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
